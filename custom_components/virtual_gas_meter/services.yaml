register_reading:
  fields:
    reading:
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          step: 0.001
          mode: box
          unit_of_measurement: "m³"
    date:
      required: false
      selector:
        datetime:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: virtual_gas_meter
delete_reading:
  fields:
    date:
      required: true
      selector:
        datetime:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: virtual_gas_meter
exclude_reading:
  fields:
    date:
      required: true
      selector:
        datetime:
    exclude:
      required: false
      default: true
      selector:
        boolean:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: virtual_gas_meter
recalculate:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: virtual_gas_meter
