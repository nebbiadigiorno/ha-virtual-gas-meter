[project]
name = "ha-virtual-gas-meter"
version = "0.2.0"
license = "MIT"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL", "BLE", "D", "SIM", "RUF"]
ignore = ["PLR0913", "PLR0915", "PLR2004", "PLR0912", "PLC0415", "D203", "D213", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR0917"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
